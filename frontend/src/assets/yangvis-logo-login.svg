<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="YANGVIS 控制台">
  <title>YANGVIS 控制台</title>

  <defs>
    <linearGradient id="jvl-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ad6de"/>
      <stop offset="100%" stop-color="#0fb5bf"/>
    </linearGradient>

    <radialGradient id="jvl-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#b8f4f2"/>
      <stop offset="100%" stop-color="#0fb5bf"/>
    </radialGradient>

    <filter id="jvl-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arc-reactor mark -->
  <g transform="translate(100 48) scale(1.45)" fill="none" stroke="url(#jvl-stroke)" stroke-linecap="round">
    <!-- outer bezel, broken into arcs for a HUD feel -->
    <circle r="17.5" stroke-width="1.2" stroke-opacity=".4"
            stroke-dasharray="19 8.5" stroke-dashoffset="4"/>
    <!-- segmented energy ring -->
    <circle r="12.5" stroke-width="3.4" stroke-opacity=".92"
            stroke-dasharray="6.2 3.6" filter="url(#jvl-glow)"/>
    <!-- containment ring -->
    <circle r="7.4" stroke-width="1.4" stroke-opacity=".7"/>
    <!-- registration ticks at the cardinal points -->
    <g stroke-width="1.3" stroke-opacity=".75">
      <path d="M0 -20.5V-19"/>
      <path d="M0 19V20.5"/>
      <path d="M-20.5 0H-19"/>
      <path d="M19 0H20.5"/>
    </g>
    <!-- core -->
    <circle r="3.6" fill="url(#jvl-core)" stroke="none" filter="url(#jvl-glow)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="103" y="107" fill="#ffffff" font-size="22" font-weight="600"
          letter-spacing="4">YANGVIS</text>
    <path d="M46 118H154" stroke="url(#jvl-stroke)" stroke-width="1" stroke-opacity=".45"/>
    <text x="103" y="133" fill="#3ad6de" font-size="9.4" font-weight="500"
          letter-spacing="5" opacity=".8">CONSOLE</text>
  </g>
</svg>
