<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 46" role="img" aria-label="YANGVIS 控制台">
  <title>YANGVIS 控制台</title>

  <defs>
    <linearGradient id="jv-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ad6de"/>
      <stop offset="100%" stop-color="#0fb5bf"/>
    </linearGradient>

    <radialGradient id="jv-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#b8f4f2"/>
      <stop offset="100%" stop-color="#0fb5bf"/>
    </radialGradient>

    <filter id="jv-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arc-reactor mark -->
  <g transform="translate(23 23)" fill="none" stroke="url(#jv-stroke)" stroke-linecap="round">
    <!-- outer bezel, broken into four arcs for a HUD feel -->
    <circle r="17.5" stroke-width="1.2" stroke-opacity=".45"
            stroke-dasharray="19 8.5" stroke-dashoffset="4"/>
    <!-- segmented energy ring -->
    <circle r="12.5" stroke-width="3.4" stroke-opacity=".9"
            stroke-dasharray="6.2 3.6" filter="url(#jv-glow)"/>
    <!-- containment ring -->
    <circle r="7.4" stroke-width="1.4" stroke-opacity=".75"/>
    <!-- registration ticks at the cardinal points -->
    <g stroke-width="1.3" stroke-opacity=".8">
      <path d="M0 -20.5V-19"/>
      <path d="M0 19V20.5"/>
      <path d="M-20.5 0H-19"/>
      <path d="M19 0H20.5"/>
    </g>
    <!-- core -->
    <circle r="3.6" fill="url(#jv-core)" stroke="none" filter="url(#jv-glow)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="22" fill="#ffffff" font-size="15" font-weight="600"
          letter-spacing="2.4">YANGVIS</text>
    <path d="M50.5 29.5H140" stroke="url(#jv-stroke)" stroke-width="1" stroke-opacity=".5"/>
    <text x="51" y="40" fill="#3ad6de" font-size="7.4" font-weight="500"
          letter-spacing="2.5" opacity=".85">CONSOLE</text>
  </g>
</svg>
