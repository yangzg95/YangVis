<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -26 52 52" role="img" aria-label="YANGVIS 弧反应堆印记">
  <g fill="none" stroke="#3ad6de" stroke-linecap="round">
    <!-- outer bezel, broken into arcs for a HUD feel -->
    <circle r="17.5" stroke-width="1.2" stroke-opacity=".4"
            stroke-dasharray="19 8.5" stroke-dashoffset="4"/>
    <!-- segmented energy ring -->
    <circle r="12.5" stroke-width="3.4" stroke-opacity=".92"
            stroke-dasharray="6.2 3.6"/>
    <!-- containment ring -->
    <circle r="7.4" stroke-width="1.4" stroke-opacity=".7"/>
    <!-- registration ticks at the cardinal points -->
    <g stroke-width="1.3" stroke-opacity=".75">
      <path d="M0 -20.5V-19"/>
      <path d="M0 19V20.5"/>
      <path d="M-20.5 0H-19"/>
      <path d="M19 0H20.5"/>
    </g>
    <!-- core -->
    <circle r="3.6" fill="#b8f4f2" stroke="none"/>
  </g>
</svg>
